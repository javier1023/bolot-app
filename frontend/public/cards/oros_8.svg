<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 168" width="120" height="168">
  <!-- Fondo -->
  <defs>
    <linearGradient id="bgoros" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white"/>
      <stop offset="100%" stop-color="#FFFDE7"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="116" height="164" rx="9" ry="9"
        fill="url(#bgoros)" stroke="#B8860B" stroke-width="2.5"/>

  <!-- Línea decorativa interior -->
  <rect x="5" y="5" width="110" height="158" rx="7" ry="7"
        fill="none" stroke="#B8860B" stroke-width="0.8" opacity="0.3"/>

  <!-- Valor esquina superior izquierda -->
  <text x="10" y="22" font-family="Georgia,serif" font-size="19"
        font-weight="bold" fill="#B8860B">8</text>

  <!-- Símbolo esquina superior izquierda -->
  <g transform="translate(18,36) scale(0.45)">
      <circle cx="0" cy="0" r="22" fill="#FFD700" stroke="#B8860B" stroke-width="3.5"/>
      <circle cx="0" cy="0" r="13" fill="#B8860B" opacity="0.25"/>
      <circle cx="0" cy="0" r="6" fill="#B8860B" opacity="0.5"/>
    </g>

  <!-- Nombre del palo (pequeño) -->
  <text x="10" y="54" font-family="Arial,sans-serif" font-size="7"
        fill="#B8860B" opacity="0.6">Oros</text>

  <!-- Símbolo central grande -->
  <g transform="translate(60,88) scale(1.05)">
      <circle cx="0" cy="0" r="22" fill="#FFD700" stroke="#B8860B" stroke-width="3.5"/>
      <circle cx="0" cy="0" r="13" fill="#B8860B" opacity="0.25"/>
      <circle cx="0" cy="0" r="6" fill="#B8860B" opacity="0.5"/>
    </g>

  <!-- Valor esquina inferior derecha (rotado) -->
  <g transform="rotate(180,60,84)">
    <text x="110" y="82" font-family="Georgia,serif" font-size="19"
          font-weight="bold" fill="#B8860B" text-anchor="end">8</text>
  </g>

  <!-- Símbolo esquina inferior derecha -->
  <g transform="translate(102,140) scale(0.45)">
      <circle cx="0" cy="0" r="22" fill="#FFD700" stroke="#B8860B" stroke-width="3.5"/>
      <circle cx="0" cy="0" r="13" fill="#B8860B" opacity="0.25"/>
      <circle cx="0" cy="0" r="6" fill="#B8860B" opacity="0.5"/>
    </g>

  <!-- Badge de puntos -->
  
</svg>
