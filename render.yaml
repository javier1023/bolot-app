services:
  - type: web
    name: bolot
    runtime: python
    region: frankfurt
    buildCommand: >
      pip install -r backend/requirements.txt &&
      npm --prefix frontend install &&
      npm --prefix frontend run build
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

